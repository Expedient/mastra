name: Fork release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact clean release commit to package
        required: true
        type: string
      reviewed_baseline_commit:
        description: Exact previously reviewed baseline commit
        required: true
        default: b23d4277e12e30816e154401d9d1e012d5d383e1
        type: string
      upstream_base:
        description: Exact rollback/base commit before the reviewed upstream sync
        required: true
        type: string
      artifact_name:
        description: Expedient transport package name
        required: true
        default: '@expedient/mastra-native'
        type: string
      artifact_version:
        description: Exact immutable transport package version
        required: true
        default: 0.1.0-expedient.1
        type: string
      evidence_seed:
        description: Canonical repository-relative externally reviewed evidence seed
        required: true
        type: string
      reviewed_network_allowlist:
        description: Canonical repository-relative reviewed allowlist source
        required: true
        type: string
      network_exercises:
        description: Canonical repository-relative real runtime exercise manifest
        required: true
        type: string
  workflow_call:
    inputs:
      release_commit: { required: true, type: string }
      reviewed_baseline_commit: { required: true, type: string }
      upstream_base: { required: true, type: string }
      artifact_name: { required: true, type: string }
      artifact_version: { required: true, type: string }
      evidence_seed: { required: true, type: string }
      reviewed_network_allowlist: { required: true, type: string }
      network_exercises: { required: true, type: string }
    outputs:
      artifact_name:
        description: Actions artifact containing only the fully gated release material
        value: ${{ jobs.release-artifact.outputs.artifact_name }}
      artifact_sha256:
        description: SHA-256 of the exact gated aggregate npm artifact
        value: ${{ jobs.release-artifact.outputs.artifact_sha256 }}

permissions:
  contents: read

concurrency:
  group: fork-release-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1
  PNPM_VERSION: 11.13.1

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_commit || github.sha }}
      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Activate integrity-qualified pnpm from packageManager
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Test and statically validate fork release tooling
        run: pnpm fork-release:test && pnpm fork-release:schemas && pnpm fork-release:static

  release-artifact:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artifact_name: fork-npm-artifacts
      artifact_sha256: ${{ steps.artifact.outputs.sha256 }}
    env:
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      ARTIFACT_VERSION: ${{ inputs.artifact_version }}
      EVIDENCE_SEED: ${{ inputs.evidence_seed }}
      NETWORK_EXERCISES: ${{ inputs.network_exercises }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      REVIEWED_BASELINE_COMMIT: ${{ inputs.reviewed_baseline_commit }}
      REVIEWED_NETWORK_ALLOWLIST: ${{ inputs.reviewed_network_allowlist }}
      UPSTREAM_BASE: ${{ inputs.upstream_base }}
    steps:
      - name: Checkout exact release source with history
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_commit }}
      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Activate integrity-qualified pnpm from packageManager
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Validate immutable commits, ancestry, paths, and clean release HEAD
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$REVIEWED_BASELINE_COMMIT" "$RELEASE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          for value in "$EVIDENCE_SEED" "$REVIEWED_NETWORK_ALLOWLIST" "$NETWORK_EXERCISES"; do
            [[ "$value" != /* && "$value" != *".."* && "$value" != *"\\"* ]]
            test -f "$value"
          done
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Reject upstream commercial reintroduction
        run: node scripts/fork-release/release-gate.mjs upstream-sync --base "$UPSTREAM_BASE"
      - name: Build release package graph once
        run: pnpm build
      - name: Require build to leave a clean release HEAD
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Assemble immutable Expedient npm bundle from clean HEAD
        run: |
          mkdir -p release
          node scripts/fork-release/assemble-release-artifact.mjs \
            --root . \
            --manifest scripts/fork-release/native-package-manifest.json \
            --output release/fork-npm-artifacts.tgz \
            --provenance release/fork-provenance.json \
            --name "$ARTIFACT_NAME" \
            --version "$ARTIFACT_VERSION" \
            --reviewed-baseline-commit "$REVIEWED_BASELINE_COMMIT" \
            --release-commit "$RELEASE_COMMIT"
      - name: Record immutable artifact digest
        id: artifact
        shell: bash
        run: echo "sha256=$(sha256sum release/fork-npm-artifacts.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Generate complete CycloneDX SBOM and license inventory
        run: |
          node scripts/fork-release/generate-cyclonedx.mjs \
            --root . \
            --artifact release/fork-npm-artifacts.tgz \
            --sbom release/fork-sbom.cdx.json \
            --inventory release/fork-licenses.cdx.json \
            --name "$ARTIFACT_NAME" \
            --version "$ARTIFACT_VERSION"
      - name: Scan exact packed artifact and complete licenses
        run: |
          node scripts/fork-release/release-gate.mjs bundles --artifact release/fork-npm-artifacts.tgz
          node scripts/fork-release/release-gate.mjs licenses \
            --inventory release/fork-licenses.cdx.json \
            --artifact release/fork-npm-artifacts.tgz \
            --sbom release/fork-sbom.cdx.json
      - name: Bind reviewed network policy to the fresh artifact
        run: |
          node scripts/fork-release/bind-network-allowlist.mjs \
            --source "$REVIEWED_NETWORK_ALLOWLIST" \
            --artifact release/fork-npm-artifacts.tgz \
            --output release/fork-network-allowlist.json
      - name: Capture every required real runtime at the OS boundary
        run: |
          node scripts/fork-release/release-gate.mjs network-linux \
            --artifact release/fork-npm-artifacts.tgz \
            --capture release/fork-network.jsonl \
            --allowlist release/fork-network-allowlist.json \
            --exercises "$NETWORK_EXERCISES"
      - name: Explicitly review the fresh network capture
        run: |
          node scripts/fork-release/release-gate.mjs network-review \
            --artifact release/fork-npm-artifacts.tgz \
            --capture release/fork-network.jsonl \
            --allowlist release/fork-network-allowlist.json
      - name: Run compatibility only from clean-room installed tarballs
        run: |
          node scripts/fork-release/release-gate.mjs compatibility-run \
            --artifact release/fork-npm-artifacts.tgz \
            --output release/fork-native-compatibility.json
          node scripts/fork-release/release-gate.mjs compatibility-review \
            --artifact release/fork-npm-artifacts.tgz \
            --evidence release/fork-native-compatibility.json \
            --baseline-commit "$REVIEWED_BASELINE_COMMIT" \
            --release-commit "$RELEASE_COMMIT"
      - name: Assemble final digest-bound release manifest from fresh evidence
        run: |
          node scripts/fork-release/assemble-release-manifest.mjs \
            --root . \
            --seed "$EVIDENCE_SEED" \
            --output release/fork-release-evidence.json \
            --artifact release/fork-npm-artifacts.tgz \
            --provenance release/fork-provenance.json \
            --sbom release/fork-sbom.cdx.json \
            --licenses release/fork-licenses.cdx.json \
            --network-capture release/fork-network.jsonl \
            --network-allowlist release/fork-network-allowlist.json \
            --reviewed-network-allowlist "$REVIEWED_NETWORK_ALLOWLIST" \
            --compatibility release/fork-native-compatibility.json
      - name: Enforce correlated final release evidence
        run: node scripts/fork-release/release-gate.mjs release --manifest release/fork-release-evidence.json
      - name: Upload only fully gated immutable material
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fork-npm-artifacts
          path: |
            release/fork-npm-artifacts.tgz
            release/fork-provenance.json
            release/fork-sbom.cdx.json
            release/fork-licenses.cdx.json
            release/fork-network.jsonl
            release/fork-network-allowlist.json
            release/fork-native-compatibility.json
            release/fork-release-evidence.json
          if-no-files-found: error
          retention-days: 7
