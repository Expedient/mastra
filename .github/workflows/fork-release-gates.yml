name: Fork release gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_base:
        description: Rollback/base commit recorded before the reviewed upstream sync
        required: true
        type: string
      artifact_paths:
        description: Comma-separated final built artifact files or directories
        required: true
        type: string
      license_inventory:
        description: CycloneDX license inventory path
        required: true
        type: string
      network_capture:
        description: Runtime network capture JSONL path
        required: true
        type: string
      network_allowlist:
        description: Reviewed runtime network allowlist path
        required: true
        type: string
      evidence_manifest:
        description: Resolved release-evidence manifest path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with migration history
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 22.23.1
      - name: Test fork release tooling
        run: corepack pnpm fork-release:test
      - name: Check audited graph and active source
        run: corepack pnpm fork-release:static

  release-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    env:
      ARTIFACT_PATHS: ${{ inputs.artifact_paths }}
      EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
      LICENSE_INVENTORY: ${{ inputs.license_inventory }}
      NETWORK_ALLOWLIST: ${{ inputs.network_allowlist }}
      NETWORK_CAPTURE: ${{ inputs.network_capture }}
      UPSTREAM_BASE: ${{ inputs.upstream_base }}
    steps:
      - name: Checkout repository with migration history
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js 22.23.1
        uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 22.23.1
      - name: Reject upstream reintroduction
        run: node scripts/fork-release/release-gate.mjs upstream-sync --base "$UPSTREAM_BASE"
      - name: Scan final built artifacts
        run: node scripts/fork-release/release-gate.mjs bundles --artifacts "$ARTIFACT_PATHS"
      - name: Verify license inventory
        run: node scripts/fork-release/release-gate.mjs licenses --inventory "$LICENSE_INVENTORY"
      - name: Verify captured runtime destinations
        run: node scripts/fork-release/release-gate.mjs network-review --capture "$NETWORK_CAPTURE" --allowlist "$NETWORK_ALLOWLIST"
      - name: Verify immutable release evidence
        run: node scripts/fork-release/release-gate.mjs evidence --manifest "$EVIDENCE_MANIFEST"
